<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Chat Traductor con IA</title>
   <link rel="stylesheet" href="./assets/css/style.css">
   <link rel="icon" type="image/png" href="./assets/img/logo-translator.png">
</head>
<body>

   <header class="chat__header">
      <img class="header__icon" src="./assets/img/logo-translator.png" alt="Logo - Chat Traductor con IA">
      <h1 class="header__title">Chat Traductor con IA</h1>
   </header>

   <section class="chat">

      <div class="chat__messages">

      </div>

      <div class="chat__input-group">
         <input id="inputText" class="chat__input" type="text" placeholder="Escribe una frase en español...">
         <div class="chat__inputs">
            <select id="targetLang" class="chat__select">
               <option value="ingles">Inglés</option>
               <option value="español">Español</option>
               <option value="frances">Francés</option>
               <option value="aleman">Alemán</option>
               <option value="italiano">Italiano</option>
               <option value="portugues">Portugués</option>
            </select>
            <button id="translateButton" class="chat__button">Traducir</button>
         </div>
      </div>

   </section>

   <script src="./assets/js/main.js" defer></script>
</body>
</html>
